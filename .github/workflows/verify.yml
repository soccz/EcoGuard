name: Verify and release

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out tracked release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source, reproducible wheel, installed runtime and artifacts
        env:
          ECOGUARD_RELEASE_DIST: ${{ matrix.python-version == '3.14' && startsWith(github.ref, 'refs/tags/v') && format('{0}/release-dist', runner.temp) || '' }}
        run: ./scripts/verify_release.sh

      - name: Upload the exact verified release wheel
        if: matrix.python-version == '3.14' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-wheel
          path: ${{ runner.temp }}/release-dist/*.whl
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out verified tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download the exact verified release wheel
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release-wheel
          path: dist

      - name: Check tag and release artifact shape
        shell: bash
        run: |
          package_version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
          shopt -s nullglob
          wheels=(dist/*.whl)
          shopt -u nullglob
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected one verified release wheel." >&2
            exit 1
          fi
          if [[ "${wheels[0]}" != "dist/ecoguard_evidence-${package_version}-py3-none-any.whl" ]]; then
            echo "Release wheel filename does not match tag version." >&2
            exit 1
          fi
          sha256sum dist/*.whl | sed 's#  dist/#  #' > dist/SHA256SUMS.txt
          sha256sum presentation/EcoGuard_Selected_Excerpt.pdf |
            sed 's#presentation/##' >> dist/SHA256SUMS.txt

      - name: Attest release wheel provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*.whl"

      - name: Attest case-study PDF provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: presentation/EcoGuard_Selected_Excerpt.pdf

      - name: Publish verified tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl
          dist/SHA256SUMS.txt
          "presentation/EcoGuard_Selected_Excerpt.pdf#EcoGuard_Selected_Excerpt.pdf"
          --verify-tag
          --generate-notes
          --title "EcoGuard $GITHUB_REF_NAME"
