name: Forest XAI research

"on":
  push:
    branches:
      - main
    paths:
      - "research/forest_xai/**"
      - ".github/workflows/forest-xai.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "research/forest_xai/**"
      - ".github/workflows/forest-xai.yml"
      - "pyproject.toml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forest-xai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 CPU research checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            research/forest_xai/requirements.txt

      - name: Install pinned CPU research dependencies
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0"
          python -m pip install \
            --disable-pip-version-check \
            --requirement research/forest_xai/requirements.txt \
            "black==24.8.0" \
            "ruff==0.16.2"
          python - <<'PY'
          from importlib.metadata import version

          import torch

          assert version("numpy") == "1.26.4"
          assert version("Pillow") == "12.2.0"
          assert version("torch").split("+", 1)[0] == "2.13.0"
          assert version("black") == "24.8.0"
          assert version("ruff") == "0.16.2"
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.cuda.is_available()
          print(f"verified CPU-only PyTorch {torch.__version__}")
          PY
          python -m pip check

      - name: Run Forest XAI unit tests
        run: python -m unittest discover -s research/forest_xai/tests -v

      - name: Check Forest XAI source quality
        run: |
          python -m ruff check research/forest_xai
          python -m black --check research/forest_xai
          python -m compileall -q research/forest_xai

      - name: Verify committed public demo
        run: python -m research.forest_xai.scripts.verify_public_demo --retrain

      - name: Verify and retrain post-award reconstruction
        run: python -m research.forest_xai.scripts.verify_reconstruction --retrain
