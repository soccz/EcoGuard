<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">EcoGuard core proof flow from an OCR line to the artifact manifest</title>
  <desc id="desc">A committed synthetic CBAM field keeps its raw line, character span, and SHA-256 through normalization, an eleven-step calculation DAG, reconciliation, and output manifest hashes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#177f68"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font-size: 28px; font-weight: 750; fill: #102a26; }
      .subtitle { font-size: 15px; fill: #48645e; }
      .step { font-size: 13px; font-weight: 750; letter-spacing: 1.1px; fill: #177f68; }
      .heading { font-size: 20px; font-weight: 720; fill: #102a26; }
      .body { font-size: 14px; fill: #243d38; }
      .small { font-size: 12px; fill: #48645e; }
      .code { font-size: 13px; fill: #102a26; }
      .hash { font-size: 11px; fill: #35524c; }
      .metric { font-size: 18px; font-weight: 750; fill: #0d6b58; }
      .badge { font-size: 12px; font-weight: 700; fill: #0d6b58; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="22" fill="#f7fbfa"/>
  <rect x="1" y="1" width="1198" height="678" rx="21" fill="none" stroke="#c6ddd7" stroke-width="2"/>

  <text x="54" y="58" class="sans title">한 필드가 증거가 되는 경로</text>
  <text x="54" y="86" class="sans subtitle">committed synthetic fixture · raw line/span/hash → selected normalization → CBAM DAG/reconciliation → SHA-256 manifest</text>

  <rect x="54" y="118" width="260" height="424" rx="18" fill="#ffffff" stroke="#a9d0c6" stroke-width="2"/>
  <text x="76" y="151" class="sans step">01 · SOURCE</text>
  <text x="76" y="181" class="sans heading">OCR line provenance</text>
  <rect x="76" y="202" width="216" height="64" rx="10" fill="#edf7f4"/>
  <text x="88" y="226" class="mono code">M5 공정 직접배출 :</text>
  <text x="88" y="250" class="mono code">3.200 tCO2e/t</text>
  <text x="76" y="294" class="sans body">page 1 · line 5</text>
  <text x="76" y="320" class="sans body">value span <tspan class="mono">[13,26)</tspan></text>
  <text x="76" y="346" class="sans body">record</text>
  <text x="76" y="367" class="mono small">ev-cbam-product-sheet-</text>
  <text x="76" y="385" class="mono small">p01-l005</text>
  <text x="76" y="417" class="sans body">line SHA-256</text>
  <text x="76" y="439" class="mono hash">1afb604e7aec173c5d8e957eaa4e4b6</text>
  <text x="76" y="457" class="mono hash">b263160508c5c61b9527b9683d09ec656</text>
  <rect x="76" y="486" width="130" height="30" rx="15" fill="#dff2ed"/>
  <text x="91" y="506" class="sans badge">raw-line hash ✓</text>

  <line x1="323" y1="330" x2="350" y2="330" stroke="#177f68" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="360" y="118" width="220" height="424" rx="18" fill="#ffffff" stroke="#a9d0c6" stroke-width="2"/>
  <text x="382" y="151" class="sans step">02 · SELECT</text>
  <text x="382" y="181" class="sans heading">Normalized field</text>
  <text x="382" y="226" class="sans small">selected value</text>
  <text x="382" y="258" class="mono metric">3.2 tCO2e/t</text>
  <text x="382" y="299" class="sans small">transformation</text>
  <text x="382" y="322" class="mono small">normalize_emission_</text>
  <text x="382" y="340" class="mono small">intensity_unit</text>
  <text x="382" y="382" class="sans small">selection policy</text>
  <text x="382" y="405" class="sans body">parseable → authority</text>
  <text x="382" y="427" class="sans body">→ confidence → order</text>
  <rect x="382" y="468" width="151" height="30" rx="15" fill="#dff2ed"/>
  <text x="397" y="488" class="sans badge">selected_from ✓</text>

  <line x1="589" y1="330" x2="616" y2="330" stroke="#177f68" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="626" y="118" width="260" height="424" rx="18" fill="#ffffff" stroke="#a9d0c6" stroke-width="2"/>
  <text x="648" y="151" class="sans step">03 · CALCULATE</text>
  <text x="648" y="181" class="sans heading">11-step CBAM DAG</text>
  <text x="648" y="222" class="sans small">evidence leaves</text>
  <text x="648" y="250" class="mono metric">90 t × 3.2 = 288.00</text>
  <text x="648" y="274" class="sans small">m5.process_direct · tCO2e</text>
  <line x1="648" y1="298" x2="864" y2="298" stroke="#d5e7e2" stroke-width="2"/>
  <text x="648" y="328" class="sans small">item sums</text>
  <text x="648" y="354" class="mono body">502.56 + 608.80</text>
  <text x="648" y="389" class="sans small">shipment.component_sum</text>
  <text x="648" y="421" class="mono metric">1,111.36 tCO2e</text>
  <rect x="648" y="451" width="214" height="64" rx="10" fill="#edf7f4"/>
  <text x="662" y="475" class="sans badge">direct + indirect ✓</text>
  <text x="662" y="499" class="sans badge">process + precursor ✓</text>

  <line x1="895" y1="330" x2="922" y2="330" stroke="#177f68" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="932" y="118" width="214" height="424" rx="18" fill="#ffffff" stroke="#a9d0c6" stroke-width="2"/>
  <text x="954" y="151" class="sans step">04 · BIND</text>
  <text x="954" y="181" class="sans heading">Artifact manifest</text>
  <text x="954" y="220" class="sans small">normalized_evidence.json</text>
  <text x="954" y="243" class="mono hash">4dfe0a249c1628446da4</text>
  <text x="954" y="260" class="mono hash">791a07eef0f108c6ac11</text>
  <text x="954" y="277" class="mono hash">23e8f8f8f1bcaa1e5f8a</text>
  <text x="954" y="294" class="mono hash">4764</text>
  <text x="954" y="330" class="sans small">cbam_exposure.json</text>
  <text x="954" y="353" class="mono hash">f1a710c21021b91c9cae</text>
  <text x="954" y="370" class="mono hash">690878ac840822420261</text>
  <text x="954" y="387" class="mono hash">bc6b4652a04102839930</text>
  <text x="954" y="404" class="mono hash">6811</text>
  <rect x="954" y="451" width="168" height="64" rx="10" fill="#edf7f4"/>
  <text x="968" y="476" class="sans badge">10 core outputs</text>
  <text x="968" y="499" class="sans badge">bytes + SHA-256 ✓</text>

  <rect x="54" y="574" width="1092" height="60" rx="12" fill="#153a33"/>
  <text x="76" y="599" class="sans" font-size="13" font-weight="700" fill="#bfe8de">SOURCE OF VALUES</text>
  <text x="76" y="620" class="mono" font-size="12" fill="#ffffff">artifacts/examples/{extracted_records,normalized_evidence,cbam_exposure,artifact_manifest}.json · verify: make proof</text>
</svg>
