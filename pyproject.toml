[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoguard-evidence"
version = "0.2.0"
description = "Auditable OCR-after preprocessing, legal retrieval, CBAM and forest evidence pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team UniHana" }]
keywords = ["cbam", "eudr", "trade-finance", "data-quality", "legal-retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://soccz.github.io/projects/ecoguard/"
Repository = "https://github.com/soccz/EcoGuard"
"Issue tracker" = "https://github.com/soccz/EcoGuard/issues"

[project.scripts]
ecoguard = "ecoguard.cli:main"

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "ruff==0.15.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecoguard = ["resources/*.json", "resources/*.csv"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
