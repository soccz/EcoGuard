[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoguard-evidence"
version = "0.5.0"
description = "Auditable OCR-after preprocessing, legal retrieval, CBAM and forest evidence pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "soccz" }]
keywords = ["cbam", "eudr", "trade-finance", "data-quality", "legal-retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://soccz.github.io/projects/ecoguard/"
Repository = "https://github.com/soccz/EcoGuard"
"Issue tracker" = "https://github.com/soccz/EcoGuard/issues"

[project.scripts]
ecoguard = "ecoguard.cli:main"
ecoguard-api = "ecoguard.api:main"

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "coverage==7.15.4",
  "hypothesis==6.165.3",
  "jsonschema==4.26.0",
  "ruff==0.16.2",
]

[tool.coverage.run]
branch = true
source = ["ecoguard"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecoguard = ["resources/*.json", "resources/*.csv"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
